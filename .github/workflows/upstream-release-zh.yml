name: hakuX 上游正式版简体中文发行

on:
  # 每天北京时间 11:17 检查上游最新正式 Release。
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hakux-zhcn-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: 检查上游最新正式 Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(gh api repos/rfandango/hakuX/releases/latest)"
          upstream_tag="$(jq -r '.tag_name // empty' <<< "$metadata")"

          if [[ -z "$upstream_tag" ]]; then
            echo "::error::无法读取上游 Latest Release。"
            exit 1
          fi

          release_tag="zhcn-${upstream_tag}"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          if gh release view "$release_tag" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "汉化版 $release_tag 已存在，跳过重复构建。"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "发现新上游正式版本：$upstream_tag"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      UPSTREAM_TAG: ${{ needs.check.outputs.upstream_tag }}
      RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
      # runner 上下文不能用于 job 级 env；使用工作区内的统一临时目录。
      SRC_DIR: ${{ github.workspace }}/.build/hakux-source
      NC_DEPS: ${{ github.workspace }}/.build/hakux-native-deps
      AUTOMATION_DIR: ${{ github.workspace }}/automation

    steps:
      - name: 检出汉化工作流与词条
        uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false

      - name: 安装系统依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git jq ninja-build rsync python3 unzip zip

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已移除旧的 tools 软件包，因此只安装仍受支持的平台工具。
          packages: platform-tools

      - name: 安装 Android SDK 与 NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;3.30.3"

          echo "$ANDROID_HOME/cmake/3.30.3/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: 下载上游指定 Release 源码
        id: source
        shell: bash
        run: |
          set -euo pipefail

          # 源码与依赖统一放入工作区临时目录，先创建克隆所需的父目录。
          mkdir -p "$(dirname "$SRC_DIR")" "$(dirname "$NC_DEPS")"

          git clone --depth 1 --branch "$UPSTREAM_TAG" \
            https://github.com/rfandango/hakuX.git "$SRC_DIR"

          echo "upstream_commit=$(git -C "$SRC_DIR" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # 初始化原生核心所需的 FEX 子模块及嵌套子模块。
          git -C "$SRC_DIR" submodule update --init external/fex
          git -C "$SRC_DIR/external/fex" submodule update --init \
            External/fmt \
            External/range-v3 \
            External/rpmalloc \
            External/unordered_dense \
            External/xxhash \
            Source/Common/cpp-optparse

      - name: 生成首版汉化资源并修改界面文案
        shell: bash
        run: |
          set -euo pipefail

          python3 "$AUTOMATION_DIR/tools/localization/apply_translation.py" \
            --root "$SRC_DIR" \
            --dictionary "$AUTOMATION_DIR/localization/strings_zh_cn.json" \
            --report "$RUNNER_TEMP/translation-audit.txt"

          # 把汉化词条与脚本一并放进对应版本源码，便于独立接档。
          mkdir -p "$SRC_DIR/localization" "$SRC_DIR/tools/localization"
          cp "$AUTOMATION_DIR/localization/strings_zh_cn.json" \
            "$SRC_DIR/localization/strings_zh_cn.json"
          cp "$AUTOMATION_DIR/tools/localization/apply_translation.py" \
            "$SRC_DIR/tools/localization/apply_translation.py"
          cp "$AUTOMATION_DIR/tools/localization/prepare_build.py" \
            "$SRC_DIR/tools/localization/prepare_build.py"
          cp "$AUTOMATION_DIR/docs/汉化自动构建说明.md" \
            "$SRC_DIR/docs_简体中文汉化自动构建说明.md"
          mkdir -p "$SRC_DIR/.github/workflows"
          cp "$AUTOMATION_DIR/.github/workflows/upstream-release-zh.yml" \
            "$SRC_DIR/.github/workflows/upstream-release-zh.yml"

      - name: 读取本次 Release 的原生依赖版本
        id: deps
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$SRC_DIR/android/README.md" "$GITHUB_OUTPUT" <<'PY'
          import sys
          from pathlib import Path

          readme = Path(sys.argv[1])
          output = Path(sys.argv[2])

          if not readme.is_file():
              raise SystemExit("缺少上游 android/README.md，无法确定依赖版本。")

          expected = {
              "volk": "volk",
              "glslang": "glslang",
              "spirv_reflect": "spirv_reflect",
              "vma": "vma",
              "SDL3": "SDL3",
              "adrenotools": "adrenotools",
              "nv2a_vsh_cpu": "root/subprojects/nv2a_vsh_cpu",
          }
          found = {}

          for line in readme.read_text(encoding="utf-8").splitlines():
              if not line.strip().startswith("|"):
                  continue
              cells = [
                  cell.strip().strip("`")
                  for cell in line.strip().strip("|").split("|")
              ]
              if len(cells) < 2:
                  continue
              path, revision = cells[0], cells[1]
              if path in expected.values():
                  name = next(k for k, v in expected.items() if v == path)
                  found[name] = revision.split(",")[0].strip().strip("`")

          missing = sorted(set(expected) - set(found))
          if missing:
              raise SystemExit(
                  "本次 Release 的构建说明缺少依赖版本：" + ", ".join(missing)
              )

          with output.open("a", encoding="utf-8") as stream:
              for name, revision in found.items():
                  stream.write(f"{name}={revision}\n")
          PY

      - name: 获取原生核心依赖源码
        env:
          VOLK_REF: ${{ steps.deps.outputs.volk }}
          GLSLANG_REF: ${{ steps.deps.outputs.glslang }}
          SPIRV_REFLECT_REF: ${{ steps.deps.outputs.spirv_reflect }}
          VMA_REF: ${{ steps.deps.outputs.vma }}
          SDL3_REF: ${{ steps.deps.outputs.SDL3 }}
          ADRENOTOOLS_REF: ${{ steps.deps.outputs.adrenotools }}
          NV2A_VSH_CPU_REF: ${{ steps.deps.outputs.nv2a_vsh_cpu }}
        shell: bash
        run: |
          set -euo pipefail

          clone_at() {
            local url="$1"
            local ref="$2"
            local destination="$3"
            mkdir -p "$(dirname "$destination")"
            git clone --filter=blob:none --no-checkout "$url" "$destination"
            git -C "$destination" checkout --detach "$ref"
          }

          # 该依赖有时会固定到当前远程分支不再包含的历史提交。
          # 先尝试 Git 获取；如果 Git 对象不可用，则下载同一提交的源码归档。
          # 这个备用流程仅用于不需要后续 Git 操作的 nv2a_vsh_cpu。
          clone_nv2a_or_archive() {
            local url="$1"
            local ref="$2"
            local destination="$3"
            local repo_slug="${url#https://github.com/}"
            local archive="$RUNNER_TEMP/nv2a_vsh_cpu.tar.gz"
            local fetch_log="$RUNNER_TEMP/nv2a_vsh_cpu-fetch.log"
            local resolved_ref="$ref"

            repo_slug="${repo_slug%.git}"
            mkdir -p "$(dirname "$destination")"

            # 先按正常方式克隆，确保提交仍可通过远程 Git 历史取得时保留完整仓库。
            if git clone --filter=blob:none --no-checkout "$url" "$destination"; then
              if git -C "$destination" cat-file -e "${ref}^{commit}" 2>/dev/null; then
                git -C "$destination" checkout --detach "$ref"
                return 0
              fi

              # 对象不在本地时，直接请求固定提交；远程服务器可能仍允许按提交号获取。
              if git -C "$destination" fetch --filter=blob:none origin "$ref" >"$fetch_log" 2>&1; then
                git -C "$destination" checkout --detach FETCH_HEAD
                return 0
              fi
            fi

            echo "::notice::固定提交 $ref 无法通过 Git 历史取得，改用 GitHub 源码归档。"
            rm -rf "$destination"
            mkdir -p "$destination"

            # GitHub 的归档服务可以按提交号提供源码，不要求提交对象存在于当前克隆历史中。
            if ! curl -fLsS --retry 3 --retry-delay 2 \
              "https://codeload.github.com/${repo_slug}/tar.gz/${ref}" \
              -o "$archive"; then
              echo "::notice::短提交号归档不可用，尝试通过 GitHub API 解析完整提交号。"
              resolved_ref="$(curl -fLsS --retry 3 \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${repo_slug}/commits/${ref}" \
                | python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])')"
              curl -fLsS --retry 3 --retry-delay 2 \
                "https://codeload.github.com/${repo_slug}/tar.gz/${resolved_ref}" \
                -o "$archive"
            fi

            # 先检查压缩包是否完整，再将 GitHub 自动生成的顶层目录去掉。
            tar -tzf "$archive" >/dev/null
            tar -xzf "$archive" --strip-components=1 -C "$destination"
            if [[ -z "$(find "$destination" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
              echo "::error::依赖源码归档为空：${repo_slug} @ ${ref}"
              exit 1
            fi
            echo "[依赖] 已取得源码归档：${repo_slug} @ ${resolved_ref}"
          }

          mkdir -p "$NC_DEPS"

          clone_at https://github.com/zeux/volk.git \
            "$VOLK_REF" "$NC_DEPS/volk"
          clone_at https://github.com/KhronosGroup/glslang.git \
            "$GLSLANG_REF" "$NC_DEPS/glslang"
          clone_at https://github.com/KhronosGroup/SPIRV-Reflect.git \
            "$SPIRV_REFLECT_REF" "$NC_DEPS/spirv_reflect"
          clone_at https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git \
            "$VMA_REF" "$NC_DEPS/vma"
          clone_at https://github.com/libsdl-org/SDL.git \
            "$SDL3_REF" "$NC_DEPS/SDL3"
          clone_at https://github.com/bylaws/libadrenotools.git \
            "$ADRENOTOOLS_REF" "$NC_DEPS/adrenotools"
          clone_nv2a_or_archive https://github.com/xemu-project/nv2a_vsh_cpu.git \
            "$NV2A_VSH_CPU_REF" "$NC_DEPS/root/subprojects/nv2a_vsh_cpu"

          patch_file="$SRC_DIR/tools/native/adrenotools-kgsl-context-priority.patch"
          if [[ ! -f "$patch_file" ]]; then
            echo "::error::上游 Release 缺少 adrenotools KGSL 补丁。"
            exit 1
          fi

          git -C "$NC_DEPS/adrenotools" apply --check "$patch_file"
          git -C "$NC_DEPS/adrenotools" apply "$patch_file"

      - name: 从 GitHub Secrets 恢复固定签名密钥
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          # 缺少任一 Secret 时立即停止，防止生成不同签名的 APK。
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::缺少 GitHub Actions Secret：$name"
              exit 1
            fi
          done

          signing_dir="$RUNNER_TEMP/hakux-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/hakux-zhcn.jks"
          chmod 600 "$signing_dir/hakux-zhcn.jks"

          # 先验证密钥库密码与别名，避免到 Gradle 阶段才发现配置错误。
          keytool -list \
            -keystore "$signing_dir/hakux-zhcn.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "SIGNING_KEYSTORE=$signing_dir/hakux-zhcn.jks" >> "$GITHUB_ENV"

      - name: 准备独立包名、版本号和固定签名配置
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          python3 "$AUTOMATION_DIR/tools/localization/prepare_build.py" \
            --root "$SRC_DIR" \
            --upstream-tag "$UPSTREAM_TAG" \
            --keystore "$SIGNING_KEYSTORE" \
            --keystore-password "$ANDROID_KEYSTORE_PASSWORD" \
            --key-alias "$ANDROID_KEY_ALIAS" \
            --key-password "$ANDROID_KEY_PASSWORD"

      - name: 编译 Android 原生核心
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          build_dir="$SRC_DIR/build/native/core"
          configure_log="$RUNNER_TEMP/hakux-cmake-configure.log"

          mkdir -p "$build_dir"

          # 同时保存 CMake 的标准输出与错误输出，便于定位配置失败原因。
          # 如果配置失败，打印错误上下文、探测日志和关键工具链参数。
          set +e
          cmake --log-level=VERBOSE \
            -S "$SRC_DIR/native" \
            -B "$build_dir" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DNC_DEPS="$NC_DEPS" \
            2>&1 | tee "$configure_log"
          cmake_status=${PIPESTATUS[0]}
          set -e

          if [[ "$cmake_status" -ne 0 ]]; then
            echo "::error::CMake 原生核心配置失败，正在输出诊断信息。"

            echo "::group::CMake 配置错误摘要"
            grep -n -B 8 -A 20 -E \
              'CMake Error|CMake Warning|FATAL_ERROR|error:|Error at|Configuring incomplete|not found|Failed' \
              "$configure_log" || true
            echo "::endgroup::"

            configure_detail="$build_dir/CMakeFiles/CMakeConfigureLog.yaml"
            if [[ -f "$configure_detail" ]]; then
              echo "::group::CMakeConfigureLog.yaml 末尾"
              tail -n 240 "$configure_detail"
              echo "::endgroup::"
            fi

            error_log="$build_dir/CMakeFiles/CMakeError.log"
            if [[ -f "$error_log" ]]; then
              echo "::group::CMakeError.log 末尾"
              tail -n 160 "$error_log"
              echo "::endgroup::"
            fi

            cache_file="$build_dir/CMakeCache.txt"
            if [[ -f "$cache_file" ]]; then
              echo "::group::关键 CMake 配置"
              grep -E \
                '^(ANDROID_ABI|ANDROID_PLATFORM|CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_PROCESSOR|CMAKE_TOOLCHAIN_FILE|CMAKE_C_COMPILER|CMAKE_CXX_COMPILER|NC_DEPS):' \
                "$cache_file" || true
              echo "::endgroup::"
            fi

            exit "$cmake_status"
          fi

          ninja -C "$build_dir" hakuxcore

          cd "$SRC_DIR"
          bash tools/native/app-libs.sh

      - name: 编译并验证 APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SRC_DIR/android"
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

          mapfile -t apks < <(
            find app/build/outputs/apk/release -type f -name '*.apk' | sort
          )

          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::预期得到一个 Release APK，实际得到 ${#apks[@]} 个。"
            exit 1
          fi

          unzip -t "${apks[0]}" >/dev/null
          mkdir -p "$RUNNER_TEMP/hakux-release-assets"
          cp "${apks[0]}" \
            "$RUNNER_TEMP/hakux-release-assets/hakuX-${UPSTREAM_TAG}-zh-CN.apk"

          sha256sum \
            "$RUNNER_TEMP/hakux-release-assets/hakuX-${UPSTREAM_TAG}-zh-CN.apk" \
            > "$RUNNER_TEMP/hakux-release-assets/SHA256SUMS.txt"

      - name: 生成完整源码附件和构建信息
        env:
          UPSTREAM_COMMIT: ${{ steps.source.outputs.upstream_commit }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          assets="$RUNNER_TEMP/hakux-release-assets"
          source_archive="$assets/hakuX-${UPSTREAM_TAG}-zh-CN-source.tar.gz"
          build_info="$assets/build-info.txt"
          notes="$assets/release-notes.md"

          # 把构建时使用的固定版本第三方源码一并收进源码附件，
          # 避免源码包依赖 Actions 临时目录。
          mkdir -p "$SRC_DIR/vendor-build-deps"
          rsync -a "$NC_DEPS/" "$SRC_DIR/vendor-build-deps/"

          # 清理密钥配置、构建产物和 Git 元数据，避免把它们发到公开 Release。
          rm -f "$SRC_DIR/android/key.properties" "$SRC_DIR/android/app/key.properties"
          rm -rf "$SRC_DIR/android/.gradle" "$SRC_DIR/android/app/build" "$SRC_DIR/build"
          find "$SRC_DIR" -name .git -exec rm -rf {} +

          tar -czf "$source_archive" \
            --exclude='*.jks' \
            --exclude='key.properties' \
            --exclude='.gradle' \
            --exclude='*/build' \
            -C "$SRC_DIR" .

          cat > "$build_info" <<EOF
          上游仓库：rfandango/hakuX
          上游正式版本：${UPSTREAM_TAG}
          上游提交：${UPSTREAM_COMMIT}
          汉化发行标签：${RELEASE_TAG}
          构建时间（UTC）：$(date -u '+%Y-%m-%d %H:%M:%S')
          构建架构：arm64-v8a
          应用包名后缀：.zhcn
          签名：GitHub Secrets 保存的固定社区构建签名
          汉化审查：translation-audit.txt
          EOF

          gh api "repos/rfandango/hakuX/releases/tags/${UPSTREAM_TAG}" \
            > "$RUNNER_TEMP/upstream-release.json"

          {
            echo "# hakuX ${UPSTREAM_TAG} 简体中文版"
            echo
            echo "本发行基于上游正式 Release \`${UPSTREAM_TAG}\` 构建。"
            echo
            echo "- 应用包名为官方包名加 \`.zhcn\`，可与官方版并行安装。"
            echo "- APK 使用 GitHub Actions Secrets 中保存的固定社区签名，不是上游官方签名。"
            echo "- 源码附件包含对应上游源码、汉化资源、翻译脚本和固定版本的原生依赖源码。"
            echo "- 许可证：GPL-3.0-or-later；第三方组件依其各自许可证执行。"
            echo
            echo "## 上游更新说明"
            echo
            jq -r '.body // "上游未提供更新说明。"' \
              "$RUNNER_TEMP/upstream-release.json"
            echo
            echo "## 汉化审查"
            echo
            echo "详见附件 \`translation-audit.txt\`。首版词条为部分汉化，未匹配内容需要后续补译。"
          } > "$notes"

          cp "$RUNNER_TEMP/translation-audit.txt" "$assets/translation-audit.txt"

      - name: 发布正式简体中文版 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          assets="$RUNNER_TEMP/hakux-release-assets"

          gh release create "$RELEASE_TAG" \
            "$assets/hakuX-${UPSTREAM_TAG}-zh-CN.apk" \
            "$assets/hakuX-${UPSTREAM_TAG}-zh-CN-source.tar.gz" \
            "$assets/build-info.txt" \
            "$assets/SHA256SUMS.txt" \
            "$assets/translation-audit.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "hakuX ${UPSTREAM_TAG} 简体中文版" \
            --notes-file "$assets/release-notes.md"
