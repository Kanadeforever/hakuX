# 清理 hakuX 自动汉化构建中失败的运行记录。
# 只删除 upstream-release-zh.yml 工作流中已结束且结论为 failure 的记录；
# 成功、取消、正在运行的记录，以及本清理工作流自身的记录都会保留。

name: 清理失败的 hakuX 构建记录

on:
  # GitHub Actions 定时表达式使用 UTC；每天 04:00 UTC 执行。
  # 上游 Release 检查安排在 03:17 UTC，清理任务独立运行。
  schedule:
    - cron: "0 4 * * *"

  # 允许在 Actions 页面手动执行。
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: hakux-cleanup-failed-builds
  cancel-in-progress: false

jobs:
  cleanup:
    name: 删除失败的汉化构建记录
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: 删除已失败的上游汉化构建记录
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "[清理] 仓库：${REPO}"
          echo "[清理] 目标工作流：upstream-release-zh.yml"
          echo "[清理] 查询已完成的运行记录，并筛选结论为 failure 的记录……"

          # 先把 API 结果写入文件，确保 API 查询失败时立即终止，
          # 避免进程替换隐藏错误后被误判为“没有失败记录”。
          RUN_IDS_FILE="$(mktemp)"
          trap 'rm -f "$RUN_IDS_FILE"' EXIT

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPO}/actions/workflows/upstream-release-zh.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "failure") | .id' \
            > "$RUN_IDS_FILE"

          mapfile -t RUN_IDS < "$RUN_IDS_FILE"

          if [[ "${#RUN_IDS[@]}" -eq 0 ]]; then
            echo "[清理] 没有失败的汉化构建记录。"
            exit 0
          fi

          echo "[清理] 找到 ${#RUN_IDS[@]} 条失败记录。"

          # 逐条删除目标工作流中已完成且失败的运行记录。
          # 不查询其他工作流，因此不会删除成功构建或清理工作流自身的记录。
          for RUN_ID in "${RUN_IDS[@]}"; do
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || {
              echo "::error::发现无效的 workflow run ID：${RUN_ID}"
              exit 1
            }

            echo "[删除] workflow run ${RUN_ID}"
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPO}/actions/runs/${RUN_ID}"
          done

          echo "[清理] 完成。"
